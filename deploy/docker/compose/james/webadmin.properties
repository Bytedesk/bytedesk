# 微语定制版 Apache James WebAdmin 配置（基于官方 sample-configuration/webadmin.properties）
# 官方配置说明: https://james.apache.org/server/config-webadmin.html
#
# 官方镜像默认：host=localhost（仅容器内可达）+ password.generate=true（每次启动生成随机密码写入日志），
# 导致宿主机无法稳定访问 WebAdmin。本覆盖配置改为：
# - 监听 0.0.0.0（配合 compose 端口映射，宿主机经 http://127.0.0.1:18000 访问）
# - 固定密码（下方 password 项）
#
# 安全提醒：
# - WebAdmin 拥有域名/用户/邮箱等全部管理权限，仅在内网/防火墙保护下暴露 18000 端口
# - 部署后请立即修改下方密码
enabled=true
port=8000
host=0.0.0.0

# HTTPS（可选，启用后取消注释并配置 keystore）
https.enabled=false
#https.keystore=/root/conf/keystore
#https.password=james72laBalle

# JWT（JPA 版不含 jwt 模块，保持 false）
#jwt.enabled=false

# CORS（按需开启）
#cors.enable=false
#cors.origin

# 额外扩展路由（classpath 或 ./extensions-jars 下的类）
#extensions.routes=

# 密码认证：false = 使用下方固定密码（不再每次启动随机生成）
password.generate=false
# WebAdmin 认证密码（请求时通过 Header 携带：Password: <该值>）
password=bytedesk-james-admin
# 只读密码（仅允许 GET 请求，按需启用）
#password.readonly=readonly-secret
