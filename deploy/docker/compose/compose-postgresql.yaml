# PostgreSQL 数据库（四选一：mysql / postgresql / oracle / kingbase）
# 启动方式：./start.sh postgresql ... 或 docker compose --env-file .env -f compose/compose-postgresql.yaml up -d（在 deploy/docker 目录执行）
# 应用侧 DSN 由 start.sh 按所选数据库自动注入（或通过 .env 中 SPRING_DATASOURCE_* 显式配置）
services:
  bytedesk-postgresql:
    image: postgres:17
    container_name: postgresql-bytedesk
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bytedesk}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:${POSTGRES_PORT:-5432}"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bytedesk}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bytedesk-network

volumes:
  postgresql_data:
    name: bytedesk_postgresql_data

networks:
  bytedesk-network:
    driver: bridge
