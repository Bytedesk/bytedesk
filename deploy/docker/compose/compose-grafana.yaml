# Grafana 可视化仪表板（可观测性组件，关键字：grafana 或组合关键字 obs）
# 启动方式：./start.sh obs ... 或 docker compose --env-file .env -f compose/compose-grafana.yaml up -d（在 deploy/docker 目录执行）
# 访问 http://localhost:13000，使用 .env 中 GRAFANA_ADMIN_USER/GRAFANA_ADMIN_PASSWORD（默认 admin/admin）登录
services:
  bytedesk-grafana:
    image: grafana/grafana:latest
    container_name: grafana-bytedesk
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/ai-observability.json
    ports:
      - '13000:3000'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - bytedesk-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  grafana_data:
    name: bytedesk_grafana_data

networks:
  bytedesk-network:
    driver: bridge
