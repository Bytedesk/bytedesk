#
# https://sip.weiyuai.cn
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_certificate /etc/nginx/ssl/weiyuai.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/nginx/ssl/weiyuai.cn/privkey.pem; # managed by Certbot

    server_name sip.weiyuai.cn;

    root /var/www/html;
	index index.html index.htm index.nginx-debian.html index.php;

	location = / {
        try_files /index.html =404;
    }

	location = /coturn.html {
		return 301 https://coturn.weiyuai.cn/;
	}

	location / {
        # 匹配所有路径，并尝试首先提供文件，然后目录，最后回退到index.html
        try_files $uri $uri/ /index.html; # 这里应该指向根目录的index.html，而不是特定路径下的index.html
    }

    location ^~ /freeswitch-recordings/ {
        alias /usr/local/freeswitch/var/lib/freeswitch/recordings/;
        autoindex off;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # SIP over WebSocket Secure (SIP/WSS)
    location /ws {
        # Terminate TLS at nginx and proxy to FreeSWITCH WSS (7443)
        proxy_pass https://freeswitch_wss;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }

    # Alternate path for WSS, same behavior as /ws
    location /wss {
        proxy_pass https://freeswitch_wss;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }

    # SIP over WebSocket (SIP/WS) - fallback
    location /ws-insecure {
        proxy_pass http://freeswitch_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Server $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        # Error handling
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
    }


}
