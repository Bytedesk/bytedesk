#
# HTTPS server for coturn.weiyuai.cn - Coturn Monitoring and Testing
#
# 注意：Coturn 是 STUN/TURN 服务器（UDP/TCP），不是 HTTP 服务器
# Nginx 无法直接代理 STUN/TURN 协议
# 此配置仅提供监控接口和测试页面的 HTTPS 访问
# 
# urls: "stun:coturn.weiyuai.cn:3478"
# urls: "turn:coturn.weiyuai.cn:3478"
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_certificate /etc/nginx/ssl/weiyuai.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/nginx/ssl/weiyuai.cn/privkey.pem; # managed by Certbot

    # urls: "stun:coturn.weiyuai.cn:3478"
    # urls: "turn:coturn.weiyuai.cn:3478"
    server_name coturn.weiyuai.cn;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    # Enforce HTTPS on this subdomain
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Web Admin 管理界面（需要在 turnserver.conf 中启用 web-admin）
    # 在 /etc/turnserver.conf 中添加:
    # web-admin
    # web-admin-ip=0.0.0.0
    # web-admin-port=8080
    location /admin {
        default_type text/plain;
        return 503 'Coturn web-admin is not enabled on this host. Enable web-admin in /etc/turnserver.conf and bind it to a dedicated local port before exposing /admin via Nginx.\n';
    }

    # 与首页复用同一静态文件的测试访问路径
    location = /test {
        root /var/www/html/coturn;
        try_files /index.html =404;
        
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        
        # CORS headers
        add_header Access-Control-Allow-Origin "https://coturn.weiyuai.cn" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
        add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;
        
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "https://coturn.weiyuai.cn" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }
    }
    
    # 服务信息和使用说明（备用路径）
    location = / {
        root /var/www/html/coturn;
        try_files /index.html =404;
    }

    # 简单健康检查端点
    location = /health {
        default_type text/plain;
        return 200 'ok';
    }
}
