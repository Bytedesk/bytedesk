# ===============================
# = 阿里云 OSS / 短信（统一前缀 bytedesk.aliyun）
# ===============================
# 2026-11 起统一为 bytedesk.aliyun.* 前缀，历史 key（aliyun.region.id / aliyun.access.key.id /
# aliyun.oss.* / aliyun.sms.*）已废弃；Docker 环境变量改为 BYTEDESK_ALIYUN_* 命名
# （如 BYTEDESK_ALIYUN_SMS_SIGN_NAME、BYTEDESK_ALIYUN_ACCESS_KEY_ID），见 deploy/docker/compose/compose-bytedesk.yaml

# 阿里云OSS启用开关（仅控制 OSS 上传，短信/邮件密钥始终读取）
# bytedesk.aliyun.enabled=true

bytedesk.aliyun.region-id=cn-hangzhou
# 获取阿里云密钥 https://ram.console.aliyun.com/profile/access-keys
bytedesk.aliyun.access-key-id=placeholder
bytedesk.aliyun.access-key-secret=placeholder

# 阿里云OSS服务相关配置
# OSS的endpoint,这里是华南地区(也就是深圳)
bytedesk.aliyun.oss.endpoint=https://oss-cn-shenzhen.aliyuncs.com
bytedesk.aliyun.oss.base-url=https://bytedesk.oss-cn-shenzhen.aliyuncs.com
# 这是创建的bucket
bytedesk.aliyun.oss.bucket-name=placeholder

# 阿里云短信服务
# 短信签名 https://dysms.console.aliyun.com/domestic/text/sign
bytedesk.aliyun.sms.sign-name=微语
# 短信模板管理 https://dysms.console.aliyun.com/domestic/text/template
bytedesk.aliyun.sms.template-code=SMS_xxxxxxxxx
# 短信接口请求参数，未配置时使用默认值
bytedesk.aliyun.sms.domain=dysmsapi.aliyuncs.com
bytedesk.aliyun.sms.version=2017-05-25
bytedesk.aliyun.sms.action=SendSms
