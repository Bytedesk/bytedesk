# ===============================
# = Spring AI MCP
# ===============================
# ===============================
# = Spring AI MCP
# ===============================
# https://docs.spring.io/spring-ai/reference/api/mcp/mcp-client-boot-starter-docs.html
spring.ai.mcp.client.enabled=false

# Bytedesk MCP client (bytedesk-manager source): load external MCP servers from
# admin console (AI -> MCP, McpServerEntity with direction=CLIENT/DUAL + enabled=true).
# Note: this switch is separate from spring.ai.mcp.client.enabled, which only enables
# Spring AI auto-configured connections (spring.ai.mcp.client.sse/stdio.connections.*).
# Warning: the switches above only enable loading, they do NOT create any connection.
# At least one actual connection is required, otherwise
# GET /spring/ai/api/v1/mcp/client/ping fails with "No MCP clients available":
#   (1) an McpServerEntity record in admin console (AI -> MCP, direction=CLIENT/DUAL,
#       enabled=true), then POST /spring/ai/api/v1/mcp/client/clients/refresh to reload;
#   (2) a properties connection, e.g. loopback to the local bytedesk MCP server:
#       spring.ai.mcp.client.streamable.http.connections.bytedesk-local.url=http://127.0.0.1:9003
#       spring.ai.mcp.client.streamable.http.connections.bytedesk-local.endpoint=/mcp
bytedesk.ai.mcp.client.enabled=false
# bytedesk.ai.mcp.client.max-connections=10
# bytedesk.ai.mcp.client.connection-timeout-ms=30000
# bytedesk.ai.mcp.client.request-timeout-ms=60000
# bytedesk.ai.mcp.client.health-check-interval-ms=60000

# MCP Server is disabled by default. Enable only when external MCP clients are required.
spring.ai.mcp.server.enabled=false
spring.ai.mcp.server.name=bytedesk-mcp-server
spring.ai.mcp.server.version=${application.version:4.0.0}
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.stdio=false
spring.ai.mcp.server.sse-message-endpoint=/mcp/message
spring.ai.mcp.server.tool-change-notification=true
spring.ai.mcp.server.protocol=STREAMABLE

# Bytedesk MCP auth. When MCP is enabled, configure this token externally.
bytedesk.ai.mcp.auth.enabled=true
bytedesk.ai.mcp.auth.bearer-token=
bytedesk.ai.mcp.auth.sse-endpoint=/sse
bytedesk.ai.mcp.auth.message-endpoint=/mcp/message

# Conservative default: expose read-only Bytedesk tools when MCP server is explicitly enabled.
bytedesk.ai.mcp.tools.enabled=true
bytedesk.ai.mcp.tools.read-only=true
bytedesk.ai.mcp.tools.include-packages=com.bytedesk
bytedesk.ai.mcp.tools.allow-names=bytedeskKnowledgeSearch,bytedeskTicketCreate
bytedesk.ai.mcp.tools.deny-names=
bytedesk.ai.mcp.tools.write-allow-names=bytedeskTicketCreate
bytedesk.ai.mcp.tools.read-only-include-pattern=.*(Query|Search|Find|Get|List|Count).*
bytedesk.ai.mcp.tools.exclude-pattern=.*(Create|Update|Delete|Remove|Cancel|Change|Optimize|Reset|Score|Set|Send).*
