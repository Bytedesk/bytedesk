# ===============================
#= Call FreeSwitch config
# ===============================
# enable call freeswitch
bytedesk.call.freeswitch.enabled=false
# freeswitch server ip
bytedesk.call.freeswitch.server=127.0.0.1
# SIP domain / 对外可达域名或IP，用于 visitor call 返回 domain/aor/target/server
# bytedesk.call.freeswitch.domain=your-freeswitch-domain-or-ip
# esl port
bytedesk.call.freeswitch.esl-port=8021
# esl password
bytedesk.call.freeswitch.esl-password=password
# sip port - 根据服务器实际端口修改
bytedesk.call.freeswitch.sip-port=5060
# webrtc port - 根据服务器实际端口修改
bytedesk.call.freeswitch.webrtc-port=7443
# websocket signal port - 根据服务器实际端口修改
bytedesk.call.freeswitch.ws-port=5066
# websocket secure signal port (WSS，用于 HTTPS 页面的 SIP 信令)
bytedesk.call.freeswitch.wss-port=7443

# Java MRCP server（模板默认关闭，按需开启）
bytedesk.call.mrcp.enabled=false
bytedesk.call.mrcp.profile=java-mrcp
bytedesk.call.mrcp.host=0.0.0.0
bytedesk.call.mrcp.port=1544
bytedesk.call.mrcp.tts-provider=dashscope
bytedesk.call.mrcp.asr-provider=dashscope
bytedesk.call.mrcp.asr-mode=recording-file
bytedesk.call.mrcp.tts-voice=longanhuan
# bytedesk.call.mrcp.tts-model=
# bytedesk.call.mrcp.asr-model=
# bytedesk.call.mrcp.asr-language=zh-CN
# bytedesk.call.mrcp.api-key=

# 目录文件同步方式（非默认）
# bytedesk.call.freeswitch.conf-dir=deploy/freeswitch/conf
# 分机导入来源：esl 或 directory
bytedesk.call.freeswitch.extension-import-source=esl
# 当 ESL 的 list_users 不可用或返回空时，是否回退扫描本地 conf/directory
bytedesk.call.freeswitch.extension-import-directory-fallback-enabled=false
# 默认启用 mod_xml_curl 动态目录
bytedesk.call.freeswitch.xmlcurl.enabled=true
# xml_curl 功能开关：dialplan/directory/configuration/phrases 后备处理
bytedesk.call.freeswitch.xmlcurl.dialplan-enabled=true
bytedesk.call.freeswitch.xmlcurl.directory-enabled=false
bytedesk.call.freeswitch.xmlcurl.configuration-enabled=false
bytedesk.call.freeswitch.xmlcurl.phrases-enabled=false
# xml_curl directory 用户列表：user1@domain:password,...
bytedesk.call.freeswitch.xmlcurl.directory-users=1000@${bytedesk.call.freeswitch.domain:192.168.0.102}:1234
# xml_curl configuration 白名单，逗号分隔（支持 100-200 范围写法）
bytedesk.call.freeswitch.xmlcurl.config-whitelist=
# AI hotline 动态入口路由同步：为已发布的 AI 分机自动创建/回填 CallRoute
bytedesk.call.ai-hotline-route-sync.enabled=true
# 调试开关：开启后仅记录将要同步的路由，不真正写入数据库
bytedesk.call.ai-hotline-route-sync.dry-run=false
# call timeout seconds - 增加超时时间
bytedesk.call.freeswitch.call-timeout=120
# rtp port range - 扩大端口范围
# bytedesk.call.freeswitch.rtp-port-start=16000
# bytedesk.call.freeswitch.rtp-port-end=16999
# 新增配置
# bytedesk.call.freeswitch.max-sessions=1000
# bytedesk.call.freeswitch.sessions-per-second=30
# bytedesk.call.freeswitch.log-level=WARNING

# AI 会话并发守护
# bytedesk.call.ai-session.max-concurrency-per-org=10
# bytedesk.call.ai-session.stale-ttl-minutes=30
# bytedesk.call.ai-session.sweep-interval-ms=60000

# ESL事件入库配置
# bytedesk.call.freeswitch.esl-event.enabled=true
# # 采样率范围 [0,1]，1 为全量入库
# bytedesk.call.freeswitch.esl-event.sample-rate=1.0
# # 需要忽略的 Event-Subclass（逗号分隔）
# bytedesk.call.freeswitch.esl-event.ignore-subclasses=sofia::register
# # 需要忽略的 API 命令（逗号分隔）
# bytedesk.call.freeswitch.esl-event.ignore-api-commands=status
# # headers/body JSON 最大保留长度
# bytedesk.call.freeswitch.esl-event.max-payload-length=20000
# # 保留天数，<=0 则不清理
# bytedesk.call.freeswitch.esl-event.retention-days=30
# # 清理任务时间（每日 03:30）
# bytedesk.call.freeswitch.esl-event.cleanup-cron=0 30 3 * * ?


