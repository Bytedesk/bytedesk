# ===============================
# = 文件预览(Office 转 PDF)
# ===============================

# ===============================
# = 文件预览转换配置（Office 转 PDF，参考 kkFileView）
# ===============================
# 是否启用 Office 转 PDF 预览（默认关闭，未启用时前端降级提示下载）
# 需要部署环境安装 LibreOffice；jodconverter 已作为 Java 库集成（jodconverter-local-lo），无需额外服务
bytedesk.preview.convert.enabled=false
# LibreOffice 安装目录，留空自动探测（macOS 示例：/Applications/LibreOffice.app/Contents）
bytedesk.preview.convert.office-home=
# LibreOffice 进程端口，多个逗号分隔
bytedesk.preview.convert.ports=2001
# 单次转换任务超时（毫秒），默认 3 分钟
bytedesk.preview.convert.task-execution-timeout=180000
# 进程存活超时（毫秒），默认 5 分钟
bytedesk.preview.convert.process-timeout=300000
# 每个进程最大任务数，超过后重启进程
bytedesk.preview.convert.max-tasks-per-process=20
# 待转换文件大小上限（MB）
bytedesk.preview.convert.max-file-size-mb=100
# 是否允许从对象存储 URL（MinIO 公读直链）下载源文件用于转换：本地文件系统未命中且 URL 为远程地址时生效（默认 true）
bytedesk.preview.convert.remote-source-enabled=true
# 远程源文件主机白名单（支持 host 或 host:port，多个逗号分隔），默认仅允许 MinIO endpoint（bytedesk.minio.endpoint）；如需转换 OSS/COS 等第三方对象存储直链，可在此追加
bytedesk.preview.convert.allowed-remote-hosts=
