# spring ai alibaba
# https://java2ai.com/docs/dev/get-started/
# 阿里云百炼大模型获取api key：
# https://bailian.console.aliyun.com/?apiKey=1#/api-key
# 阿里云百炼大模型模型列表：
# https://bailian.console.aliyun.com/?spm=a2c4g.11186623.0.0.11c67980m5X2VR#/model-market
spring.ai.dashscope.enabled=false
# spring.ai.dashscope.base-url=https://dashscope.aliyuncs.com
# spring.ai.dashscope.api-key=sk-xxx
# spring.ai.dashscope.chat.enabled=false
# spring.ai.dashscope.chat.options.model=qwen-max
# spring.ai.dashscope.chat.options.temperature=0.7
# spring.ai.dashscope.chat.options.topP=3
# 可选：语音合成专用Key（未配置时回退到 spring.ai.dashscope.api-key）
# spring.ai.dashscope.audio.synthesis.api-key=
# TTS 默认模型与音色，会同步给后端执行接口和管理台表单默认值
spring.ai.dashscope.audio.synthesis.options.model=cosyvoice-v3-flash
spring.ai.dashscope.audio.synthesis.options.voice=longanhuan
# spring.ai.dashscope.audio.transcription.enabled=false
# ASR 默认模型，会同步给后端执行接口和管理台表单默认值
spring.ai.dashscope.audio.transcription.options.model=paraformer-v2
# 可选：语音转写专用Key（未配置时回退到 spring.ai.dashscope.api-key）
# spring.ai.dashscope.audio.transcription.api-key=
# spring.ai.dashscope.audio.transcription.realtime-model=paraformer-realtime-v2
# spring.ai.dashscope.image.enabled=false
# spring.ai.dashscope.embedding.enabled=false
# spring.ai.dashscope.audio.synthesis.enabled=false
