# ===============================
# = Remote Assist (远程协助)
# ===============================
# 是否启用远程协助（fail-closed：false/缺失时 desktop/remote 前端不显示远程按钮，
# 后端 /api/v1/remote/** 接口同时拒绝，防止绕过前端直接调用）
bytedesk.remote.enabled=false

# 邀请码有效期（分钟）
bytedesk.remote.invitation.ttl-minutes=5
# 单用户连接尝试上限（防刷）
bytedesk.remote.invitation.max-connect-attempts=10

# 会话心跳间隔（毫秒）
bytedesk.remote.session.heartbeat-interval-ms=1500
# 控制授权租约上限（毫秒）
bytedesk.remote.session.lease-max-ms=5000
