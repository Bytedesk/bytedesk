# ===============================
# = 阿里云百炼 OpenAI 兼容模式
# ===============================
# 阿里云百炼 OpenAI 兼容端点（qwen3.8-max / qwen3.8-flash 等最新模型仅支持该协议）
# https://docs.bailian.console.aliyun.com/zh/model-studio/qwen-api-via-openai-chat-completions
spring.ai.aliyun_openai.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
# 兼容模式与原生 DashScope 共用同一 API Key，直接引用既有配置，不新增明文密钥
spring.ai.aliyun_openai.api-key=${spring.ai.dashscope.api-key:}
# 默认关闭，灰度验证后开启
spring.ai.aliyun_openai.chat.enabled=false
spring.ai.aliyun_openai.chat.options.model=qwen3.8-flash
spring.ai.aliyun_openai.chat.options.temperature=0.7

# 存量机器人迁移独立开关：默认关闭。预览随启动只读执行；
# 须同时开启 chat.enabled 才会实际写库（docs/plans/2026-10-20-dashscope-openai-compatible-mode-plan.md 4.5/4.7）
bytedesk.ai.aliyun-openai.migration.enabled=false
