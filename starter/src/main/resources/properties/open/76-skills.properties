# ===============================
# = Spring AI Agent Skills
# ===============================
# open 环境：开源社区版，Skills 工具链基本启用

# Skills 目录（classpath 下的 skills 文件夹）
agent.skills.dirs=classpath:/skills

# Skills 工具总开关
bytedesk.ai.skills.enabled=true

# Shell 工具（open 环境谨慎启用，限制命令白名单）
bytedesk.ai.skills.shell.enabled=true

# 文件系统工具（open 环境基本启用）
bytedesk.ai.skills.filesystem.enabled=true

# 网页抓取工具
bytedesk.ai.skills.web-fetch.enabled=true
