# ===============================
# = 品牌定制 / 登录方式
# ===============================
# enable custom config: name, logo, description
bytedesk.custom.enabled=false
# default null use default name
bytedesk.custom.name=
# default null use default logo
bytedesk.custom.logo=
# default null use logo config as favicon
bytedesk.custom.favicon=
# default null use: Chat As A Service
bytedesk.custom.description=
# show right corner chat
bytedesk.custom.show-right-corner-chat=false
# show demo
# bytedesk.custom.show-demo=false
# privacy policy url
bytedesk.custom.privacy-policy-url=https://www.weiyuai.cn/pages/privacy.html
# terms of service url
bytedesk.custom.terms-of-service-url=https://www.weiyuai.cn/pages/terms.html
# 外网可访问的 MQTT WebSocket 地址（nginx/反向代理场景），例如：wss://api.weiyuai.cn/websocket
# bytedesk.custom.mqtt-websocket-url=
# bytedesk.custom.upload-api-url=
bytedesk.custom.ticket-html-url=http://127.0.0.1:9003/ticket
# 微信小程序商品详情默认跳转路径
bytedesk.custom.wechat-mini-program.goods-detail-path=/pages/goods/detail/index
# 微信小程序订单详情默认跳转路径
bytedesk.custom.wechat-mini-program.order-detail-path=/pages/order/detail/index
# enable login username
bytedesk.custom.login-username-enable=true
# enable 2fa 双重验证开启
bytedesk.custom.login-2fa-enable=false
# 密码错误最大重试次数, 默认3次, 0表示不限制。
bytedesk.custom.login-max-retry-count=3
# 超过次数默认锁定10分钟, 0表示不锁定
bytedesk.custom.login-max-retry-lock-time=10
# enable login mobile
bytedesk.custom.login-mobile-enable=true
# enable login email
# bytedesk.custom.login-email-enable=false
# enable login scan
bytedesk.custom.login-scan-enable=false
# enable wechat login
bytedesk.custom.login-wechat-enable=false
# enable github login
bytedesk.custom.login-github-enable=false
# enable google login
bytedesk.custom.login-google-enable=false
# enable facebook login
bytedesk.custom.login-facebook-enable=false
# enable dingtalk login
bytedesk.custom.login-dingtalk-enable=false
# enable douyin login
bytedesk.custom.login-douyin-enable=false
# enable feishu login
bytedesk.custom.login-feishu-enable=false
# enable ldap login
bytedesk.custom.login-ldap-enable=false
# enable cas login
bytedesk.custom.login-cas-enable=false
# enable oidc login
bytedesk.custom.login-oidc-enable=false
# enable openid login
bytedesk.custom.login-openid-enable=false
# show doc url
bytedesk.custom.doc-url-show=true
# doc url
bytedesk.custom.doc-url=https://www.weiyuai.cn/docs/zh-CN/
# 是否显示 admin 管理后台帮助文档按钮（HelpDocButton），默认不显示，明确开启才显示
bytedesk.custom.help-doc-button-enabled=false
# lang: zh-CN/en-US/zh-TW
bytedesk.custom.lang=zh-CN
# show register button on login page 是否显示注册按钮（仅控制登录页注册入口显隐，不拦截注册接口）
bytedesk.custom.show-register-button=false
# auto register on login when using mobile/email login and the user is not registered, default true
bytedesk.custom.auto-register-on-login=true
# force validate mobile
bytedesk.custom.force-validate-mobile=true
# force validate email
bytedesk.custom.force-validate-email=true
# force visitor auth
bytedesk.custom.force-visitor-auth=false
# Admin welcome page WeChat MP subscribe prompt
bytedesk.custom.wechat-mp-subscribe-prompt-enabled=false
bytedesk.custom.wechat-mp-subscribe-prompt-app-id=
# 微信公众号登录通知模板 ID；未同步到数据库时作为回退值使用
bytedesk.custom.wechat-mp-login-notice-template-id=
# 自定义默认 LLM Prompt；留空时回退到 RobotConsts.ROBOT_LLM_DEFAULT_PROMPT
# bytedesk.custom.default-llm-prompt=


# ===============================
#= Sms
# ===============================
bytedesk.custom.bnd.enabled=false
