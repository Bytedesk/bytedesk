# ===============================
# = SearXNG 联网搜索
# ===============================

# ===============================
# = searxng 联网搜索（企业版高级功能，默认关闭；代码位于 enterprise/ai 模块，社区版不含此功能）
# ===============================
# 官方文档: https://docs.searxng.org/admin/installation-docker.html
# docker 启动: ./start.sh mysql artemis standard middleware search（compose-searxng.yaml）
# 测试接口（bytedesk.debug=true 时可用）: /spring/ai/api/v1/searxng/*
# 说明：noai 场景下 /search 接口仍可独立使用（不依赖大模型）；/chat 接口需要 ChatModel
bytedesk.ai.searxng.enabled=${BYTEDESK_AI_SEARXNG_ENABLED:false}
# docker 内通过容器名访问；源码本地运行请改为 http://127.0.0.1:18888
bytedesk.ai.searxng.base-url=${BYTEDESK_AI_SEARXNG_BASE_URL:http://searxng-bytedesk:8080}
bytedesk.ai.searxng.timeout-ms=${BYTEDESK_AI_SEARXNG_TIMEOUT_MS:10000}
bytedesk.ai.searxng.max-results=${BYTEDESK_AI_SEARXNG_MAX_RESULTS:5}
bytedesk.ai.searxng.safe-search=${BYTEDESK_AI_SEARXNG_SAFE_SEARCH:1}
