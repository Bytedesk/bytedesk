# ===============================
# = APNs 推送
# ===============================

# ===============================
#= push 
# ===============================
# apns bundle id
bytedesk.push.apns.bundle-id=com.kefux.im
# apns p12 url
bytedesk.push.apns.p12-url=123.p12
# apns p12 password
bytedesk.push.apns.p12-password=123456

# ===============================
# = 设备推送供应商（坐席侧业务通知）
# ===============================
# 供应商切换：apns-direct（默认，直连 APNs，存量行为）| aliyun（阿里云 EMAS Push，Android 厂商通道聚合）
# 灰度/回滚入口：切回 apns-direct 即恢复现状，无需发版
bytedesk.push.provider=apns-direct
# 阿里云 EMAS Push 凭据（未配置时 aliyun 供应商自动降级为不可用，路由器回退 apns-direct）
bytedesk.push.aliyun.access-key-id=
bytedesk.push.aliyun.access-key-secret=
# Android AppKey 兑底（可选，推荐在管理后台配置）：
# 优先在管理后台「系统配置→推送配置」配置 push.aliyun.android.appKey（后台配置即生效，无需改文件重启），
# 仅当后台未配置时才回退此兑底 key。命名带 android：仅兑底 Android 通道（iOS 服务端推送走 apns-direct，不读此处）；
# appSecret 服务端推送不消费（仅移动端 SDK initPush 用，由后台「推送配置」鉴权下发），故此处不提供。
# bytedesk.push.aliyun.android-app-key=

# ===============================
# = 阿里云 EMAS（服务端 OpenAPI 推送用，与移动端无关）
# ===============================
# 凭据体系说明：
# - access-key-id/access-key-secret：账号级 RAM 凭据，服务端 Cloud Push API
#   （cloudpush.aliyuncs.com）RPC 签名用，仅在本文件配置（Jasypt ENC 加密）。
# - Android AppKey（可选兑底）：服务端推送优先读后台 SuperSystemConfig「推送配置」
#   push.aliyun.android.appKey（与移动端 /api/v1/push/config 同源），
#   未配置时才回退上方注释的 bytedesk.push.aliyun.android-app-key。
# - appSecret：仅移动端 SDK initPush 使用，由后台「推送配置」配置并鉴权下发，
#   服务端不消费，本文件不提供，避免与 iOS/移动端凭据混淆。
