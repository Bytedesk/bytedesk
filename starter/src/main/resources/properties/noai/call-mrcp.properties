# ===============================
# = MRCP 语音服务器 / AI 热线路由 / AI 会话守护
# ===============================

# Java MRCP server（模板默认关闭，按需开启）
bytedesk.call.mrcp.enabled=false
bytedesk.call.mrcp.profile=java-mrcp
bytedesk.call.mrcp.host=0.0.0.0
bytedesk.call.mrcp.port=1544
bytedesk.call.mrcp.tts-provider=dashscope
bytedesk.call.mrcp.asr-provider=dashscope
bytedesk.call.mrcp.asr-mode=recording-file
bytedesk.call.mrcp.tts-voice=longanhuan
# bytedesk.call.mrcp.tts-model=
# bytedesk.call.mrcp.asr-model=
# bytedesk.call.mrcp.asr-language=zh-CN
# bytedesk.call.mrcp.api-key=
# AI hotline 动态入口路由同步：为已发布的 AI 分机自动创建/回填 CallRoute
bytedesk.call.ai-hotline-route-sync.enabled=true
# 调试开关：开启后仅记录将要同步的路由，不真正写入数据库
bytedesk.call.ai-hotline-route-sync.dry-run=false

