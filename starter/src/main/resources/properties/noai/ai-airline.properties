# ===============================
# = 航空客服多 Agent 演示（open_airline）
# = 参考项目: openai-cs-agents-demo
# ===============================

# 模型：复用 DeepSeek 配置（见 ai-deepseek.properties）；noai 环境未启用模型时，
# /api/airline 接口返回 CHAT_MODEL_UNAVAILABLE（HTTP 503）
# spring.ai.deepseek.api-key=...
# spring.ai.deepseek.chat.enabled=true
# spring.ai.deepseek.chat.options.model=deepseek-flash

# 预算与限流（单轮）
bytedesk.airline.turn-timeout=120s
bytedesk.airline.model-timeout=40s
bytedesk.airline.max-model-steps=16
bytedesk.airline.max-tool-calls=24
bytedesk.airline.max-handoffs=8

# 会话
bytedesk.airline.session-ttl=60m
bytedesk.airline.max-sessions=500

# 轨迹采集：默认关闭，受控评测环境开启；read-authority 留空表示仅需会话归属即可查看本人会话轨迹
bytedesk.airline.trace.enabled=false
bytedesk.airline.trace.read-authority=
bytedesk.airline.trace.retention-days=7
