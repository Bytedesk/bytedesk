# ===============================
# = AI 语音识别(ASR)与语音合成(TTS)
# ===============================


# ===============================
# = bytedesk ai defaults
# ===============================
# 管理台和执行接口共享的 TTS 默认参数
bytedesk.ai.tts.language=zh-CN
bytedesk.ai.tts.audio-format=mp3

# 管理台和执行接口共享的 ASR 默认参数
bytedesk.ai.asr.source-format=mp3
bytedesk.ai.asr.timeout-ms=180000
bytedesk.ai.asr.poll-interval-ms=1500
bytedesk.ai.asr.ttsasr.enabled=${BYTEDESK_AI_ASR_TTSASR_ENABLED:true}
bytedesk.ai.asr.ttsasr.base-url=${BYTEDESK_AI_ASR_TTSASR_BASE_URL:http://127.0.0.1:18000}
bytedesk.ai.asr.ttsasr.model=${BYTEDESK_AI_ASR_TTSASR_MODEL:funasr}
bytedesk.ai.asr.ttsasr.language=${BYTEDESK_AI_ASR_TTSASR_LANGUAGE:auto}

# TTS Realtime WebSocket 配置（Qwen-Audio Realtime 中继地址）
bytedesk.ai.tts.realtime.ws-url=${BYTEDESK_AI_TTS_REALTIME_WS_URL:wss://dashscope.aliyuncs.com/api-ws/v1/realtime}
