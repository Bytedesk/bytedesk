# ===============================
# = MinIO 对象存储
# ===============================

# ===============================
# = MinIO 对象存储配置
# ===============================
# 是否启用 MinIO 存储
bytedesk.minio.enabled=false
# MinIO 服务地址
bytedesk.minio.endpoint=http://127.0.0.1:19000
# MinIO 访问密钥
bytedesk.minio.access-key=minioadmin
# MinIO 密钥
bytedesk.minio.secret-key=minioadmin123
# MinIO 存储桶名称
bytedesk.minio.bucket-name=bytedesk
# MinIO 区域
bytedesk.minio.region=us-east-1
# 是否使用 HTTPS
bytedesk.minio.secure=false

# ===============================
# = S3 兼容对象存储（推荐命名空间，向下兼容上方 bytedesk.minio.*）
# 适用后端：MinIO / RustFS / AWS S3 / 阿里云 OSS / 腾讯云 COS 等任意 S3 兼容对象存储
# 两套配置任选其一：设 bytedesk.storage.provider=s3 后 storage.* 优先生效，
# 未显式配置的 storage.* 字段自动回落到上方 minio.* 取值
# 示例（RustFS，默认凭据 rustfsadmin/rustfsadmin，生产必须改）：
# bytedesk.storage.provider=s3
# bytedesk.storage.endpoint=http://127.0.0.1:19000
# bytedesk.storage.access-key=rustfsadmin
# bytedesk.storage.secret-key=rustfsadmin
# bytedesk.storage.bucket-name=bytedesk
# bytedesk.storage.region=us-east-1
# bytedesk.storage.secure=false
# 是否对桶设置公开读策略（默认 true 保持现有行为：裸直链 + 公读桶）
# 设为 false 时：跳过桶策略，fileUrl 改用预签名直链（适配 RustFS 等不完全支持 PutBucketPolicy 的后端）
# bytedesk.storage.public-read=false
# 预签名 URL 有效期（天），SigV4 协议上限 7 天，仅 public-read=false 时生效
# bytedesk.storage.presigned-expiry-days=7
