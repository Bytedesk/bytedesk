# ===============================
# = 客服支持 Agent（HITL）演示
# = 参考项目: openai-support-agent-demo
# ===============================

# 演示开关：默认关闭。开启后注册 /api/retail/** 端点
bytedesk.retail.enabled=false
bytedesk.retail.agent-name=小微

# 模型：复用 DeepSeek 配置（见 ai-deepseek.properties），无需单独 Key
# spring.ai.deepseek.api-key=...
# spring.ai.deepseek.chat.enabled=true
# spring.ai.deepseek.chat.options.model=deepseek-flash

# 预算与限流
bytedesk.retail.turn-timeout=120s
bytedesk.retail.model-timeout=40s
bytedesk.retail.max-model-steps=8
bytedesk.retail.max-tool-calls=12
bytedesk.retail.max-concurrent-runs=4
