# ===============================
# = 消息队列(artemis/rabbitmq)
# ===============================
#= Message Queue (MQ) switch
# ===============================
# MQ 类型: artemis / rabbitmq / kafka / rocketmq
bytedesk.mq.type=artemis

# ===============================
#= RabbitMQ config
# ===============================
bytedesk.mq.rabbitmq.enabled=false
# RabbitMQ 连接信息（默认映射端口 5673 -> 5672）
spring.rabbitmq.host=127.0.0.1
spring.rabbitmq.port=5673
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin
spring.rabbitmq.virtual-host=/
spring.rabbitmq.connection-timeout=5000

# RabbitMQ 集群配置（可选）
# 开启后会将 nodes 写入 ConnectionFactory.addresses，用于客户端在多节点间自动切换
# bytedesk.mq.rabbitmq.cluster.enabled=true
# bytedesk.mq.rabbitmq.cluster.nodes=10.0.0.11:5672,10.0.0.12:5672,10.0.0.13:5672

# ===============================
#= Artemis config (JMS)
# ===============================
# ===============================
# = spring-boot-starter-artemis
# = jms artemis
# http://localhost:8161/console/auth/login
# https://spring.io/guides/gs/messaging-jms
# https://docs.spring.io/spring-boot/reference/messaging/jms.html
# https://activemq.apache.org/components/artemis/documentation/latest/index.html
# spring.jms.pub-sub-domain=true
# ===============================
spring.artemis.mode=embedded
# spring.artemis.mode=native
# spring.artemis.broker-url=tcp://127.0.0.1:61617?reconnectAttempts=-1&retryInterval=1000&retryIntervalMultiplier=2.0&maxRetryInterval=30000
# spring.artemis.user=admin
# spring.artemis.password=admin
#
# Artemis 集群配置（可选）
# bytedesk.mq.artemis.cluster.enabled=false
# bytedesk.mq.artemis.cluster.nodes=10.0.0.11:61616,10.0.0.12:61616,10.0.0.13:61616
# bytedesk.mq.artemis.cluster.ha=true
# bytedesk.mq.artemis.cluster.randomize=true
# bytedesk.mq.artemis.cluster.reconnect-attempts=-1
# bytedesk.mq.artemis.cluster.initial-connect-attempts=-1
# bytedesk.mq.artemis.cluster.retry-interval=1000
# bytedesk.mq.artemis.cluster.retry-interval-multiplier=2.0
# bytedesk.mq.artemis.cluster.max-retry-interval=30000

# ===============================
# = Spring JMS 本地稳定性配置
# ===============================
# 电脑睡眠/断网恢复后（主要是本地开发机），TCP 连接可能被动关闭；可临时关闭缓存避免复用已关闭连接。
# 生产环境通常应开启缓存，避免频繁创建/销毁连接导致日志“爆炸”与性能抖动。
spring.jms.cache.enabled=true
