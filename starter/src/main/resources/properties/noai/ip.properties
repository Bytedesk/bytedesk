# ===============================
# IP location config
# ===============================
# default ip location provider: ip2region/maxmind
bytedesk.ip.provider=ip2region
# if the configured provider is unavailable, fallback to other available providers
bytedesk.ip.fallback-enabled=true
# ip2region database file in classpath
bytedesk.ip.ip2region.db-file=ipdb/ip2region.xdb
# MaxMind GeoLite2/GeoIP2 city database file in classpath
bytedesk.ip.maxmind.city-db-file=ipdb/GeoLite2-City.mmdb
# locales order for MaxMind place names
bytedesk.ip.maxmind.locales=zh-CN,en
