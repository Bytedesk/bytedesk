# ===============================
# = 客服支持 Agent（HITL）演示
# = 参考项目: openai-support-agent-demo
# ===============================

# 演示开关：默认关闭。开启后注册 /api/shopping/** 端点
bytedesk.shopping.enabled=false
bytedesk.shopping.agent-name=\u5c0f\u857e

# 模型：复用 DeepSeek 配置（见 ai-deepseek.properties），无需单独 Key
# spring.ai.deepseek.api-key=...
# spring.ai.deepseek.chat.enabled=true
# spring.ai.deepseek.chat.options.model=deepseek-flash

# 预算与限流
bytedesk.shopping.turn-timeout=120s
bytedesk.shopping.model-timeout=40s
bytedesk.shopping.max-model-steps=8
bytedesk.shopping.max-tool-calls=12
bytedesk.shopping.max-concurrent-runs=4
