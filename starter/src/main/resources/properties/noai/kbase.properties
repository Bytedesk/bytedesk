# ===============================
# = 知识库(helpcenter/blog)
# ===============================

# ===============================
#= Knowledge base config
# ===============================
# theme: default/eduport/social/kbdoc
bytedesk.kbase.theme=default
# html path，如：bytedesk.kbase.html-path=/var/www/html/weiyuai/helpcenter
bytedesk.kbase.html-path=helpcenter
# bytedesk.kbase.template-path=classpath:/templates/ftl/kbase
# 知识库的访问地址，请修改为服务器实际的地址
bytedesk.kbase.api-url=http://127.0.0.1:9003

# 兼容扩展配置：分别为 helpcenter / blog 单独配置（可选）
# 如果不配置，则仍使用上面的 bytedesk.kbase.* 作为 helpcenter 默认，blog 默认输出到 ${bytedesk.kbase.html-path}/blog/
# bytedesk.kbase.helpcenter.theme=default
## bytedesk.kbase.helpcenter.html-path=/var/www/html/weiyuai/helpcenter
# bytedesk.kbase.html-path=helpcenter
# bytedesk.kbase.helpcenter.api-url=http://127.0.0.1:9003
#
# blog 静态页根目录（该目录下包含 {kbUid}/post/*.html 等）
# bytedesk.kbase.blog.theme=default
## bytedesk.kbase.blog.html-path=/var/www/html/weiyuai/blog
# bytedesk.kbase.blog.html-path=blog
# bytedesk.kbase.blog.api-url=http://127.0.0.1:9003
