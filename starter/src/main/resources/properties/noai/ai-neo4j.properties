# ===============================
# = Neo4j 知识图谱
# ===============================

# ===============================
# = neo4j 知识图谱（企业版高级功能，默认关闭；代码位于 enterprise/ai 模块，社区版不含此功能）
# ===============================
# 官方文档: https://neo4j.com/docs/operations-manual/current/docker/introduction/
# docker 启动: ./start.sh middleware neo4j（compose-neo4j.yaml）
# 测试接口（bytedesk.debug=true 时可用）: /spring/ai/api/v1/neo4j/*
bytedesk.ai.neo4j.enabled=${BYTEDESK_AI_NEO4J_ENABLED:false}
# docker 内通过容器名访问；源码本地运行请改为 bolt://127.0.0.1:17687
bytedesk.ai.neo4j.uri=${BYTEDESK_AI_NEO4J_URI:bolt://neo4j-bytedesk:7687}
bytedesk.ai.neo4j.username=${BYTEDESK_AI_NEO4J_USERNAME:neo4j}
# 初始密码仅对空数据卷首次启动生效；复用旧卷时以库内实际密码为准
bytedesk.ai.neo4j.password=${BYTEDESK_AI_NEO4J_PASSWORD:bytedesk-neo4j}
bytedesk.ai.neo4j.database=${BYTEDESK_AI_NEO4J_DATABASE:neo4j}
bytedesk.ai.neo4j.connect-timeout-ms=${BYTEDESK_AI_NEO4J_CONNECT_TIMEOUT_MS:10000}
bytedesk.ai.neo4j.max-connection-pool-size=${BYTEDESK_AI_NEO4J_MAX_CONNECTION_POOL_SIZE:10}
