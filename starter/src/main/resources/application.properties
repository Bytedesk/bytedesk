# 
# ===============================
# Server Properties
#=https://docs.spring.io/spring-boot/docs/current/reference/html/application-properties.html#appendix.application-properties.server
# ===============================
spring.application.name=bytedesk
# spring.main.banner-mode=off
application.title=https://www.weiyuai.cn
application.version=4.3.0
server.port=9003
# 开启虚拟线程支持（需要 Java 21+）
spring.threads.virtual.enabled=true
# Spring Boot 4.1.0 下保留 Elasticsearch VectorStore 自动配置排除，避免与自定义 VectorStoreConfig 重复装配。
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.elasticsearch.autoconfigure.ElasticsearchVectorStoreAutoConfiguration
# Spring AI JDBC ChatMemory 表由 Liquibase 管理，关闭 starter 自动建表。
spring.ai.chat.memory.repository.jdbc.initialize-schema=never
# 设置文件编码
spring.config.encoding=UTF-8
# 设置HTTP编码
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true
spring.servlet.encoding.enabled=true
# 
# ===============================
#=freemarker
# ===============================
spring.freemarker.template-loader-path=classpath:/templates/ftl/
# spring.freemarker.template-loader-path=classpath:/templates/ftl/, \
#     classpath:/bytedesk-module-forum/templates/ftl/, \
#     classpath:/bytedesk-module-voc/templates/ftl/
spring.freemarker.suffix=.ftl
# spring.freemarker.cache=false
spring.freemarker.charset=UTF-8
spring.freemarker.content-type=text/html;charset=UTF-8
spring.freemarker.default-encoding=UTF-8
spring.freemarker.expose-request-attributes=true
spring.freemarker.expose-session-attributes=true

# 国际化配置
spring.messages.basename=i18n/messages,i18n/swagger
spring.messages.encoding=UTF-8
spring.web.locale=zh_CN
spring.web.locale-resolver=accept_header

# ===============================
#=thymeleaf
# ===============================
# 项目中主要页面使用 FreeMarker（templates/ftl/**）。
# Thymeleaf 仅用于 error/excel/file 等少量页面；否则会抢占 viewName 并在模板缺失时直接 500。
spring.thymeleaf.view-names=error/*,excel/*,file/*

# ===============================
#=JSON serialization
# ===============================
# spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
# 序列化时间 - 升级为 ZonedDateTime 支持
# spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSX
# spring.jackson.time-zone=GMT+8
# 启用HATEOAS支持
# spring.hateoas.use-hal-as-default-json-media-type=true

# ===============================
#=时区配置 - 支持 ZonedDateTime 国际化
# ===============================
# Jackson 时区配置
# spring.jackson.serialization.write-dates-as-timestamps=false
# spring.jackson.serialization.write-dates-with-zone-id=true
# spring.jackson.deserialization.read-date-timestamps-as-nanoseconds=false
# spring.jackson.deserialization.adjust-dates-to-context-time-zone=false

# 应用时区配置
# bytedesk.timezone.display=Asia/Shanghai
# bytedesk.timezone.storage=UTC
# bytedesk.timezone.conversion-enabled=true

# ===============================
#=Observability - OpenTelemetry / OTLP 默认关闭
# ===============================
# starter-opentelemetry 附带的 micrometer-registry-otlp 默认向 http://localhost:4318/v1/metrics 推送指标，
# 且不受 tracing 开关控制；未部署 OTLP 后端时会每分钟刷连接拒绝告警（java.net.ConnectException）。
# 这里全局默认关闭 OTel SDK 与 OTLP 指标导出；需要 OTel 追踪时在 profile 中通过环境变量开启：
#   MANAGEMENT_OPENTELEMETRY_ENABLED=true / MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED=true
# （local profile 的 properties/local/actuator.properties 已有 env 门控配置，优先级更高）
management.opentelemetry.enabled=false
management.otlp.metrics.export.enabled=false

# ===============================
#=Secrets Encryption - Jasypt Configuration
# ===============================
# When encrypting property values with Jasypt, provide the password via
# environment variable JASYPT_ENCRYPTOR_PASSWORD or JVM arg
# 启用 jasypt 自动解密 - 必须启用，否则 ENC(...) 格式的属性无法自动解密
# jasypt.encryptor.password=${JASYPT_ENCRYPTOR_PASSWORD:defaultDevPassword}
# jasypt.encryptor.algorithm=PBEWITHHMACSHA512ANDAES_256
# jasypt.encryptor.string-output-type=base64
# Override defaults if needed:
# bytedesk.security.jasypt.fail-on-missing-password=false
# 修改算法
# bytedesk.security.jasypt.algorithm=PBEWITHSHA256ANDAES_256
# 修改输出格式
# bytedesk.security.jasypt.string-output-type=hex
# 修改迭代次数
# bytedesk.security.jasypt.key-obtention-iterations=2000
# 修改盐生成器
# bytedesk.security.jasypt.salt-generator-class-name=org.jasypt.salt.StringFixedSaltGenerator

# ===============================
#=profiles
# ===============================
# 默认不起用ai
spring.profiles.active=noai
# 默认启用智谱ai
# spring.profiles.active=open
