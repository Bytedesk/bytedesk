# ======================= Meet Page (Weiyu Meet) =======================
page.meet.title=Weiyu Meet
page.meet.subtitle=Open-source self-hosted conferencing: meeting rooms, invite links, and attendance records — start a meeting right from the browser, your data never leaves your server
page.meet.cta.demo=Online Demo
page.meet.cta.docs=Read the Docs
page.meet.features.title=Main Features
page.meet.features.desc=The current 0.1.0 Preview starts with audio conferencing: create a meeting room, share an invite link, join the meeting, and keep attendance records automatically
page.meet.feature.room.title=Meeting Room Management
page.meet.feature.room.desc=Every meeting room has a name, room code, type, and description; your rooms are listed clearly on the home page, creating or deleting one takes a single click, and the list only shows rooms you created or joined
page.meet.feature.invite.title=One-Click Invite Links
page.meet.feature.invite.desc=Every meeting room has its own invite link — just copy and send it; colleagues open the link, sign in, and join right away, with everyone's nickname shown automatically
page.meet.feature.audio.title=Audio Conferencing
page.meet.feature.audio.desc=Join or leave a meeting directly in the browser with nothing to install; one-click mute/unmute and a live participant list
page.meet.feature.record.title=Attendance Records
page.meet.feature.record.desc=Automatically records who attended, when they joined and left, how long they stayed, and whether they were the host; records survive unexpected disconnects
page.meet.feature.admin.title=Admin Console
page.meet.feature.admin.desc=A dedicated meetAdmin console: meeting room management, attendance queries, role-based permission control, and real-time service monitoring
page.meet.feature.mic.title=Microphone Guidance
page.meet.feature.mic.desc=Checks whether your microphone is ready before joining; if permission is denied or the browser is unsupported, you get clear hints and step-by-step fixes
page.meet.feature.i18n.title=Multi-Language Support
page.meet.feature.i18n.desc=Both the meeting client and the admin console support Simplified Chinese, Traditional Chinese, and English
page.meet.why.title=Why Weiyu Meet
page.meet.why.desc=Meetings run on your own servers, and your data never passes through a third party
page.meet.why.opensource=Open source, self-hosted: the system runs on your own servers, so your data stays with you
page.meet.why.installfree=Nothing to install: meet in the browser; colleagues join straight from the invite link
page.meet.why.account=One account: reuse your company's Weiyu account — no extra sign-up
page.meet.why.audit=Auditable: attendance records are kept automatically; no manual roll call
page.meet.why.safe=Safe to share: invite links only work after signing in, and management features are granted by role
page.meet.roadmap.title=Roadmap
page.meet.roadmap.desc=Capabilities ship in stages — video conferencing and screen sharing are on the way
page.meet.roadmap.schedule=Scheduled and instant meetings
page.meet.roadmap.password=Meeting passwords and host controls
page.meet.roadmap.stats=Real-time attendance statistics
page.meet.roadmap.mobile=Mobile phones and tablets
page.meet.quickstart.title=Quick Start
page.meet.quickstart.desc=Two ways to start your first meeting right away
page.meet.quickstart.demo.title=Option 1: Try the online demo
page.meet.quickstart.demo.desc=Open the meeting client demo and sign in, create a meeting room, and send the invite link to a colleague; they open the link, sign in, click "Join", allow microphone access — and the call begins
page.meet.quickstart.demo.btn=Open the Demo
page.meet.quickstart.admin.btn=Admin Console Demo
page.meet.quickstart.deploy.title=Option 2: Deploy on your own server
page.meet.quickstart.deploy.desc=Follow the project deployment guide — Docker gets you up and running quickly; meeting data stays on your own server
page.meet.quickstart.deploy.btn=Read the Deployment Guide
page.meet.note=Browsers allow microphone access only over HTTPS or on localhost. If the microphone cannot be turned on, follow the on-screen guidance; for formal use, serve the app over HTTPS
page.meet.badge.upcoming=Coming Soon
page.meet.feature.video.title=Video Conferencing
page.meet.feature.video.desc=HD audio-video calls, multi-party meetings, whiteboard collaboration, recording and playback
page.meet.feature.screenshare.title=Screen Sharing
page.meet.feature.screenshare.desc=Share your desktop or app windows for remote demonstrations and better communication
page.meet.feature.videoservice.title=Video Support
page.meet.feature.videoservice.desc=Face-to-face video communication with remote assistance to diagnose and resolve customer issues fast
