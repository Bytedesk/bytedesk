page.office.compat.title=Is it compatible with Microsoft Office / WPS?
page.office.compat.desc=Yes. Weiyu Docs works directly with the real Microsoft Office formats (.docx/.xlsx/.pptx), with no intermediate conversion
page.office.compat.real=Files edited in Weiyu Docs open cleanly in Word/Excel/PowerPoint — layouts do not break
page.office.compat.incremental=Only the paragraphs you changed are regenerated; everything else is kept exactly as it was
page.office.compat.pagination=Pagination matches Word, so what you see is what you get
page.office.compat.wps=Documents edited and saved in WPS can be opened and edited directly as well
page.office.faq.title=FAQ
page.office.faq.ai.q=Does the AI need extra setup?
page.office.faq.ai.a=Yes — configure a model provider in the AI settings. Mainstream providers (OpenAI, Claude, Gemini, DeepSeek, Kimi, GLM, Qwen, and more) are supported, as well as custom OpenAI-compatible endpoints
page.office.faq.cloud.q=Are my documents uploaded to the cloud?
page.office.faq.cloud.a=Documents are kept on your own machine, or synced to your privately deployed Weiyu server; content is only sent to the model provider you configured, and only when you use AI features
page.office.faq.ocr.q=Does PDF conversion handle scanned files?
page.office.faq.ocr.a=Yes. On macOS and Windows, system OCR reads scanned pages and converts them into editable Word/Excel/PowerPoint files
page.office.faq.platform.q=Which platforms are supported?
page.office.faq.platform.a=Desktop apps for macOS, Windows, and Linux, with light/dark themes
page.office.tip=Tip: a version snapshot is taken before every AI edit — feel free to experiment. Turn on track changes to keep every AI edit reviewable
