# Clipper Page (notebase Web Clipper Chrome Extension)
page.clipper.title=Weiyu Clipper
page.clipper.subtitle=Clip web pages into your knowledge base with one click
page.clipper.desc=An open-source Chrome web clipper extension. While browsing, save selected content or entire pages to the Weiyu notebase knowledge base via selection or context menu. Content is automatically converted to Markdown with editable title, body and tags; save as draft or publish directly.
page.clipper.downloadBtn=Download zip package
alt.clipper.hero=Weiyu Clipper browser extension illustration
page.clipper.features.title=Core Features
page.clipper.features.desc=Clip valuable web content into your knowledge base like a pro
alt.clipper.feature.selection=Save selection icon
page.clipper.feature.selection.title=Clip on Selection
page.clipper.feature.selection.desc=Select text on any page and a floating "Save to Knowledge Base" button appears automatically. Click to save without leaving the page.
alt.clipper.feature.contextmenu=Context menu clipping icon
page.clipper.feature.contextmenu.title=Context Menu Clipping
page.clipper.feature.contextmenu.desc=Save selected content, full pages, links and images via right-click. Full-page capture automatically detects the main content and strips navigation and scripts.
alt.clipper.feature.quick=Quick save icon
page.clipper.feature.quick.title=One-click Quick Save
page.clipper.feature.quick.desc=Right-click "Quick save selection to default knowledge base" to save without opening the panel; click the system notification to jump to the edit page.
alt.clipper.feature.sidepanel=Browser side panel icon
page.clipper.feature.sidepanel.title=Browser Side Panel
page.clipper.feature.sidepanel.desc=Keep the full clipping panel open in the browser side panel (Chrome 114+), auto-refreshing on tab switch; or set the toolbar icon to open the side panel directly.
alt.clipper.feature.kbase=Knowledge base selection icon
page.clipper.feature.kbase.title=Knowledge Base Selection
page.clipper.feature.kbase.desc=After login, notebase knowledge bases in your organization are fetched automatically. Pick a target base when saving; switching sets it as default.
alt.clipper.feature.markdown=Markdown editing icon
page.clipper.feature.markdown.title=Markdown Editing
page.clipper.feature.markdown.desc=Clipped content is converted to Markdown automatically. Edit title and body, add tags (comma separated) before saving.
alt.clipper.feature.draft=Draft and publish icon
page.clipper.feature.draft.title=Draft / Publish
page.clipper.feature.draft.desc=Save as draft by default or publish directly with one switch; "Recent saves" keeps the last 10 clips with quick jump to editing in notebase.
alt.clipper.feature.misc=Multi-language and theme icon
page.clipper.feature.misc.title=Multi-language & Themes
page.clipper.feature.misc.desc=Simplified Chinese / English UI with light / dark / system themes, unified across popup, side panel, options page and in-page panel.
page.clipper.usage.title=Multiple Ways to Clip
page.clipper.usage.desc=A quote, a long article, a link or an image - save them all on the fly
page.clipper.usage.selection.title=Save Selected Content
page.clipper.usage.selection.desc=Select text -> click the "Save to Knowledge Base" floating button -> confirm in the panel
page.clipper.usage.page.title=Save Full Page
page.clipper.usage.page.desc=Right-click -> "Weiyu Clipper" -> "Save full page", main content extracted and converted to Markdown
page.clipper.usage.link.title=Save Link / Image
page.clipper.usage.link.desc=Right-click a link or image -> "Weiyu Clipper" -> "Save link" / "Save image"
page.clipper.usage.popup.title=Popup Quick Save
page.clipper.usage.popup.desc=Click the extension icon -> one-click "Save selection" or "Save full page"
page.clipper.download.title=Download Weiyu Clipper
page.clipper.download.desc=Free and open source. Works with Chrome 114+ and Chromium browsers such as Edge and Brave.
page.clipper.download.btn=Download zip package
page.clipper.download.note=Version 0.2.0 · Free & open source · Chrome 114+
alt.clipper.download=Weiyu Clipper download illustration
page.clipper.install.title=Installation Steps
page.clipper.install.desc=Start clipping in three steps
page.clipper.install.step1.title=Download & Unzip
page.clipper.install.step1.desc=Click the button above to download the zip package and unzip it to any local folder.
page.clipper.install.step2.title=Load Extension
page.clipper.install.step2.desc=Open chrome://extensions/, enable "Developer mode" at the top right, click "Load unpacked" and select the unzipped folder. Pin the extension to the toolbar for quick access.
page.clipper.install.step3.title=Sign in & Configure
page.clipper.install.step3.desc=Right-click the extension icon to open the options page (or click the gear in the popup), sign in with your Weiyu account, confirm the server URL and notebase web URL, then pick a default knowledge base to start clipping.
alt.custom.illustration=Customization illustration

