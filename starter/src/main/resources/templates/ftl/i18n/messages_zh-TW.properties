# AI Page
page.ai.title=AI Agent - 智慧代理平台
page.ai.subtitle=開源 AI Agent 平台，對接主流大模型，打造企業智慧助手
alt.ai.icon=AI Agent 圖示
page.ai.features.title=核心功能
page.ai.features.desc=AI 技術賦能企業業務流程
page.ai.feature.llm.title=多模型支援
page.ai.feature.llm.desc=對接 Ollama、DeepSeek、智譜、通義千問等主流大模型，靈活選擇最適合的 AI 能力
page.ai.feature.deploy.title=私有部署
page.ai.feature.deploy.desc=支援本地部署 Ollama 等開源大模型，資料安全完全可控，無需擔心隱私外洩
page.ai.feature.assistant.title=智慧對話
page.ai.feature.assistant.desc=自然語言理解、上下文記憶、多輪對話，提供類人化的互動體驗
page.ai.feature.rag.title=知識庫問答
page.ai.feature.rag.desc=基於 RAG 技術，結合企業知識庫提供精準答案，減少幻覺並提升可靠性
page.ai.feature.agent.title=智慧體編排
page.ai.feature.agent.desc=支援 Function Calling、MCP 協議，建構複雜的 AI 智慧體工作流程
page.ai.feature.api.title=API 介面
page.ai.feature.api.desc=標準化 API 介面，方便整合到既有業務系統，快速實現 AI 能力
page.ai.agents.title=微語 AI Agent 矩陣
page.ai.agents.desc=圍繞客服、售前、售中、售後和營運建構企業數位員工，讓服務成為成長引擎
page.ai.agent.service.title=客服助手 Agent
page.ai.agent.service.desc=輔助人工客服檢索知識、生成回覆建議、摘要會話、識別情緒與 SLA 風險，並推薦下一步服務動作。
page.ai.agent.presales.title=售前 Agent
page.ai.agent.presales.desc=識別訪客需求、推薦商品或方案、收集線索、判斷購買意向，並將高價值客戶平滑轉交人工跟進。
page.ai.agent.sales.title=售中 Agent
page.ai.agent.sales.desc=圍繞報價說明、下單引導、付款提醒、訂單查詢和履約協同，減少從諮詢到成交之間的流失。
page.ai.agent.aftersales.title=售後 Agent
page.ai.agent.aftersales.desc=處理訂單、物流、退款、退換貨、保固、投訴和工單跟進，提高售後回應效率與客戶滿意度。
page.ai.agent.operations.title=營運 Agent
page.ai.agent.operations.desc=彙聚會話、標籤、訂單和工單資料，自動生成客戶分群、觸達策略和復購營運建議。
page.ai.agent.loop.title=服務成長閉環
page.ai.agent.loop.desc=會話沉澱客戶資產，客戶資產驅動個人化服務，服務結果反哺知識、流程和營運策略。
page.ai.agent.plan.title=分階段建設規劃
page.ai.agent.plan.desc=微語將以可配置提示詞、知識庫檢索、工具呼叫、工作流程編排和資料分析為基礎，逐步開放可落地的企業智慧體能力。
page.ai.agent.plan.context=統一會話、訪客、會員、訂單、工單和知識庫上下文
page.ai.agent.plan.tools=透過權限可控的工具呼叫連接真實業務系統
page.ai.agent.plan.workflow=用工作流程承接轉人工、建工單、回訪、觸達和複盤動作
page.ai.agent.plan.analytics=持續統計回應效率、轉化率、滿意度、復購率和服務品質
page.ai.agent.value.title=從客服工具到數位員工
page.ai.agent.value.desc=AI Agent 不只是自動回覆機器人，而是能夠理解客戶、呼叫知識、執行流程、沉澱經驗並輔助成長的業務執行者。企業可以先從客服助手和知識庫問答開始，再逐步擴展到售前轉化、售中協同、售後工單和全域營運。
page.ai.models.title=支援的大模型
page.ai.model.ollama=本地部署，開源免費，支援 Llama、Qwen 等多種模型
page.ai.model.deepseek=優秀國產大模型，性價比高，推理能力強
page.ai.model.zhipu.name=智譜 AI
page.ai.model.zhipu=清華技術背景，中文理解能力出色
page.ai.model.qwen.name=通義千問
page.ai.model.qwen=阿里雲出品，多模態能力強大
page.ai.usecases.title=應用場景
page.ai.usecase.customer.title=智慧客服
page.ai.usecase.customer.desc=7x24 小時自動回覆客戶諮詢，結合知識庫提供準確答案，人工坐席兜底
page.ai.usecase.writing.title=內容創作
page.ai.usecase.writing.desc=AI 寫作助手，自動生成文件、報告、公告等內容，提升創作效率
page.ai.usecase.analysis.title=資料分析
page.ai.usecase.analysis.desc=自然語言查詢資料，自動生成報表和視覺化圖表，洞察業務趨勢
page.ai.usecase.automation.title=流程自動化
page.ai.usecase.automation.desc=智慧體自動執行重複性任務，工作流程編排提升業務效率