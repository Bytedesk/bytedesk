<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>微语知识库 - 网络连接不可用</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: #f5f7fa;
        color: #1f2329;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #141414;
          color: rgba(255, 255, 255, 0.85);
        }
        .card {
          background: #1f1f1f !important;
          box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45) !important;
        }
      }
      .card {
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
        padding: 48px 40px;
        max-width: 420px;
        text-align: center;
      }
      .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 18px;
        background: #1677ff;
        color: #fff;
        font-size: 36px;
        line-height: 72px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        margin: 0 0 24px;
        opacity: 0.65;
      }
      button {
        appearance: none;
        border: none;
        border-radius: 8px;
        background: #1677ff;
        color: #fff;
        font-size: 15px;
        padding: 10px 32px;
        cursor: pointer;
      }
      button:hover {
        background: #4096ff;
      }
      button:active {
        background: #0958d9;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">微</div>
      <h1>网络连接不可用</h1>
      <p>Network unavailable. 微语知识库需要网络连接才能同步数据，请检查网络后重试。</p>
      <button onclick="location.reload()">重新加载 / Retry</button>
    </div>
    <script>
      // 网络恢复后自动返回原页面
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
